# ==============================================================================
# HoneyChain — Full Stack Orchestration
#
#   docker compose up -d                        → postgres + mosquitto + backend + ai_ml
#   docker compose --profile blockchain up -d   → also start a local Hardhat node
#
# The Flutter mobile app runs natively on your machine (Android emulator
# reaches the backend at http://10.0.2.2:8000).
# ==============================================================================

services:
  # ── 1. Authoritative relational database ──
  postgres:
    image: postgres:16-alpine
    container_name: honeychain-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-honeychain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-honeychain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. MQTT telemetry broker (ESP32 → AI/ML → backend) ──
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: honeychain-mosquitto
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    # The checked-in broker config is deliberately open for local development.
    # Replace it with an authenticated configuration before deployment outside
    # a private LAN/container network.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. FastAPI core backend (REST + WebSocket + MQTT consumer) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeychain-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      # Inside the compose network the hosts are service names
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-honeychain}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_INPUT_TOPIC: honeychain/hive/telemetry
      MQTT_OUTPUT_TOPIC: honeychain/hive/processed
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-honeychain-production-secure-jwt-key-2026}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BLOCKCHAIN_PROVIDER_URL: ${BLOCKCHAIN_PROVIDER_URL:-http://host.docker.internal:8545}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ENV: ${ENV:-development}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── 4. AI/ML anomaly-detection processor ──
  ai_ml:
    build:
      context: .
      dockerfile: ai_ml/Dockerfile
    container_name: honeychain-aiml
    restart: always
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-honeychain}
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_INPUT_TOPIC: honeychain/hive/telemetry
      MQTT_OUTPUT_TOPIC: honeychain/hive/processed

  # ── 5. Optional: local EVM ledger for provenance (start with --profile blockchain) ──
  blockchain:
    profiles: ["blockchain"]
    image: node:20-alpine
    container_name: honeychain-hardhat
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx hardhat node --hostname 0.0.0.0"
    volumes:
      - ./blockchain:/app
      - blockchain-node-modules:/app/node_modules
    ports:
      - "8545:8545"

volumes:
  pgdata:
    driver: local
  mosquitto-data:
    driver: local
  blockchain-node-modules:
