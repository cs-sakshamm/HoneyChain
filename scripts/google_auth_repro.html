<!doctype html>
<!--
  Live Google-auth repro for the HoneyChain audit.
  Uses the EXACT same Firebase web config + SDK calls as
  mobile_app/lib/firebase_options.dart + auth_service.dart (signInWithPopup),
  then hands the returned Firebase ID token to the REAL backend
  /api/auth/google exactly like AuthController.signInWithGoogle does.
  apiKey is Firebase's public web identifier (shipped in the app) - not a secret.
-->
<html>
<head><meta charset="utf-8"><title>HoneyChain Google Auth Audit</title></head>
<body>
<pre id="log">starting...</pre>
<script type="module">
  const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
  try {
    const app = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const auth = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const firebaseConfig = {
      apiKey: 'AIzaSyDJFOj7F7I7-NIqclH4JLBhDZzvqb9_uIU',
      authDomain: 'honeychain-40065.firebaseapp.com',
      projectId: 'honeychain-40065',
      storageBucket: 'honeychain-40065.firebasestorage.app',
      messagingSenderId: '314717495726',
      appId: '1:314717495726:web:d71b1db1dd5c01dbc0a83f',
      measurementId: 'G-SVJJXDM34B',
    };
    log('STEP 1 initializeApp()');
    const fa = auth.getAuth(app.initializeApp(firebaseConfig));
    log('STEP 1 OK projectId=' + firebaseConfig.projectId);
    window.__auditReady = true;

    window.__doSignIn = async () => {
      try {
        log('STEP 2 signInWithPopup(GoogleAuthProvider) [same as auth_service.dart kIsWeb branch]');
        const provider = new auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        provider.setCustomParameters({ prompt: 'select_account' });
        const cred = await auth.signInWithPopup(fa, provider);
        log('STEP 2 OK firebase uid=' + cred.user.uid + ' email=' + cred.user.email);
        log('STEP 3 getIdToken(true)');
        const idToken = await cred.user.getIdToken(true);
        log('STEP 3 OK token len=' + idToken.length);
        log('STEP 4 POST http://localhost:8000/api/auth/google (backend exchange, role=HARVESTER)');
        const r = await fetch('http://localhost:8000/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idToken,
            name: cred.user.displayName,
            email: cred.user.email,
            role: 'HARVESTER',
            photoUrl: cred.user.photoURL,
          }),
        });
        const bodyText = await r.text();
        log('STEP 4 backend HTTP ' + r.status + ' body=' + bodyText.slice(0, 300));
        if (r.ok) {
          const data = JSON.parse(bodyText);
          log('STEP 5 backend JWT received: ' + (data.token ? 'YES (len ' + data.token.length + ')' : 'NO'));
          log('STEP 6 user row: id=' + (data.user && data.user.id) + ' role=' + (data.user && data.user.role) + ' isVerified=' + (data.user && data.user.isVerified));
          log('AUDIT RESULT: FULL LOGIN FLOW SUCCEEDED');
          window.__auditResult = 'SUCCESS';
        } else {
          log('AUDIT RESULT: BACKEND REJECTED TOKEN');
          window.__auditResult = 'BACKEND_FAIL';
        }
      } catch (e) {
        log('STEP FAIL code=' + (e.code || 'n/a') + ' message=' + (e.message || e));
        log('AUDIT RESULT: FIREBASE_FAIL');
        window.__auditResult = 'FIREBASE_FAIL';
      }
    };
    log('READY - waiting for trigger');
  } catch (e) {
    log('INIT FAIL code=' + (e.code || 'n/a') + ' message=' + (e.message || e));
    window.__auditResult = 'INIT_FAIL';
  }
</script>
</body>
</html>
