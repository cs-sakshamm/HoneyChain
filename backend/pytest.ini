# Backend-only warning policy.
#
# HoneyChain backend source must not call deprecated Python APIs — guarded by
# backend/tests/test_no_deprecated_datetime.py and enforced here by
# escalating DeprecationWarning to an error for the backend test suite.
#
# Two third-party warnings we cannot fix are narrowly ignored (instead of
# blanket-disabling escalation):
#   * anyio's BlockingPortal alias, raised via starlette's testclient;
#   * starlette's own notice about the httpx / httpx2 testclient split.
#
# Everything else that reaches backend code fails the suite.
#
# Scope note: this config lives under backend/ and is picked up when running
# `pytest backend/tests` from the repo root, so the read-only ai_ml/ suite
# (which still legitimately uses utcnow internally) is unaffected.

[pytest]
testpaths = tests
filterwarnings =
    error::DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated
    ignore:Using `httpx` with `starlette.testclient`
